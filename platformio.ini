; =============================================================================
; HỆ THỐNG PHAO QUAN TRẮC NƯỚC TỰ HÀNH (USV BUOY) & TRẠM QUAN SÁT BỜ (GCS)
; Hỗ trợ biên dịch cả 2 mạch trong cùng 1 dự án PlatformIO:
;   1. Hệ thống Phao (ESP32-S3-WROOM-1): pio run -e esp32-s3-devkitc-1
;   2. Trạm Quan Sát Bờ (ESP32 + TFT):   pio run -e esp32dev_gcs
; =============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1, esp32dev_gcs

; -----------------------------------------------------------------------------
; PHẦN 1: HỆ THỐNG PHAO QUAN TRẮC (ESP32-S3-WROOM-1)
; -----------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
monitor_rts = 0
monitor_dtr = 0
build_src_filter = +<usv_buoy/*> -<ground_station/*>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    madhephaestus/ESP32Servo @ ^3.0.5
    mikalhart/TinyGPSPlus @ ^1.0.3

; -----------------------------------------------------------------------------
; PHẦN 2: TRẠM QUAN SÁT BỜ (ESP32 DEVKIT + MÀN HÌNH TFT 240x320)
; -----------------------------------------------------------------------------
[env:esp32dev_gcs]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM12
monitor_port = COM12
monitor_rts = 0
monitor_dtr = 0
build_src_filter = +<ground_station/*> -<usv_buoy/*>
; Bảng phân vùng có 2 slot OTA (1.875MB/slot) để nạp firmware qua Wi-Fi tại /update
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    sandeepmistry/LoRa @ ^0.8.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D ILI9342_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
